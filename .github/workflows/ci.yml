name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web-electron-smoke:
    name: Web/Electron smoke checks
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install web app dependencies
        working-directory: web-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: web-app
        run: npx playwright install chromium

      - name: Static web app check
        run: python scripts/check_web_app.py

      - name: Browser smoke check
        working-directory: web-app
        run: npm run smoke:web

      - name: Keyboard focus smoke check
        working-directory: web-app
        run: npm run smoke:keyboard

      - name: Visual audit
        working-directory: web-app
        run: npm run audit:visual

      - name: Electron smoke check
        working-directory: web-app
        run: npm run smoke:electron

      - name: Local package smoke check
        working-directory: web-app
        run: |
          npm run package:local
          npm run smoke:package

      - name: Installer package smoke check
        working-directory: web-app
        run: |
          npm run package:installer
          npm run smoke:installer

      - name: Create release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/create_release_artifacts.ps1 -Version "${{ github.ref_name }}"

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: onoko-arcana-${{ github.ref_name }}-release-artifacts
          path: |
            dist/release-artifacts/onoko-arcana-${{ github.ref_name }}-setup.exe
            dist/release-artifacts/onoko-arcana-${{ github.ref_name }}-setup.exe.sha256
            dist/release-artifacts/onoko-arcana-${{ github.ref_name }}-local.zip
            dist/release-artifacts/onoko-arcana-${{ github.ref_name }}-local.zip.sha256
          if-no-files-found: error

      - name: Upload generated reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: onoko-arcana-reports
          path: reports/
          if-no-files-found: ignore
